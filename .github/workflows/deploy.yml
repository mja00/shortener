name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      # Runs after tests, which need the committed config; forks without the variable deploy wrangler.toml as-is.
      - name: use production wrangler config
        if: vars.WRANGLER_PRODUCTION_TOML != ''
        run: printf '%s\n' "$WRANGLER_PRODUCTION_TOML" > wrangler.toml
        env:
          WRANGLER_PRODUCTION_TOML: ${{ vars.WRANGLER_PRODUCTION_TOML }}

      - name: apply d1 migrations
        run: npx wrangler d1 migrations apply shortener --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: deploy worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
