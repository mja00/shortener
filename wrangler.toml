name = "shortener"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Serves on shortener.<subdomain>.workers.dev; see the README for using your own domain.
workers_dev = true

[observability]
enabled = true

  [observability.logs]
  head_sampling_rate = 1

  [observability.traces]
  enabled = true
  head_sampling_rate = 0.05

[vars]
API_USER_ID = "1"
DISABLE_REGISTRATION = "false"
NOT_FOUND_BEHAVIOR = "redirect"
THEME = "darkly"

[[d1_databases]]
binding = "DB"
database_name = "shortener"
database_id = "replace-with-your-database-id"
migrations_dir = "migrations"
