name = "shortener"
main = "src/index.ts"
compatibility_date = "2025-09-01"
routes = [
  { pattern = "mart.fyi/*", zone_name = "mart.fyi" },
  { pattern = "www.mart.fyi/*", zone_name = "mart.fyi" },
]
[vars]
API_USER_ID = "1"
DISABLE_REGISTRATION = "false"
ROOT_REDIRECT = ""
NOT_FOUND_BEHAVIOR = "redirect"
THEME = "darkly"

[[d1_databases]]
binding = "DB"
database_name = "shortener"
database_id = "f6539397-d3be-489f-8ab5-f5751fcd34ba"
migrations_dir = "migrations"
